<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Skill Optimizer banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#1b2a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3ddc97" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#4ea8ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- decorative gears -->
  <g opacity="0.18" stroke="#9fb3d1" fill="none" stroke-width="2">
    <circle cx="120" cy="320" r="60"/>
    <circle cx="120" cy="320" r="38"/>
    <circle cx="1080" cy="80" r="70"/>
    <circle cx="1080" cy="80" r="44"/>
  </g>

  <!-- center emblem: magnifier over skill cards -->
  <g transform="translate(600,150)">
    <circle r="78" fill="#0e1730" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="-22" cy="-12" r="30" fill="none" stroke="#3ddc97" stroke-width="6"/>
    <line x1="2" y1="12" x2="34" y2="44" stroke="#3ddc97" stroke-width="8" stroke-linecap="round"/>
    <g fill="#4ea8ff" opacity="0.9">
      <rect x="-52" y="34" width="26" height="8" rx="4"/>
      <rect x="-52" y="50" width="40" height="8" rx="4"/>
      <rect x="14" y="34" width="38" height="8" rx="4"/>
    </g>
  </g>

  <text x="600" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#f2f6ff">Skill Optimizer</text>
  <text x="600" y="325" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#9fb3d1">Elite skill routing for OpenClaw — hybrid TF-IDF + LLM</text>
  <rect x="470" y="350" width="260" height="6" rx="3" fill="url(#accent)"/>
</svg>
